name: Opskl CI - Invariants & Verification

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint, Test & Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript types across all workspaces
        run: npm run typecheck

      - name: Run Jest test suites (all packages and mobile apps)
        run: npm test

      - name: Verify SQL static migration invariants
        run: npm run test:sql

      - name: Build Admin Next.js Web Console
        run: npm run build:admin
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-placeholder
          NEXT_PUBLIC_APP_ENV: ci
          NEXT_PUBLIC_APP_URL: http://localhost:3000
