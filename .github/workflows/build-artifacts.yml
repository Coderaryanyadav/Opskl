name: Build Mobile Apps (APK/IPA) & Release

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Application to build'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'worker'
          - 'organizer'
          - 'admin'
      platform:
        description: 'Target platform'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'android'
          - 'ios'
          - 'web'
      profile:
        description: 'EAS build profile (preview = APK/Ad-hoc IPA, production = AAB/Release IPA)'
        required: true
        default: 'preview'
        type: choice
        options:
          - 'preview'
          - 'production'
          - 'preview-simulator'
      build_mode:
        description: 'Build execution mode (local runner or EAS cloud)'
        required: true
        default: 'local'
        type: choice
        options:
          - 'local'
          - 'eas-cloud'
      publish_release:
        description: 'Publish as GitHub Release'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 0. Quality Gate: Verify Monorepo Before Packaging
  # -------------------------------------------------------------
  verify-quality-gate:
    name: Verify Types, Tests & Static Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Check TypeScript Compilation
        run: npm run typecheck

      - name: Run Test Suites
        run: npm test

      - name: Verify SQL Migration Invariants
        run: npm run test:sql

  # -------------------------------------------------------------
  # 1. Opskl Worker Android APK
  # -------------------------------------------------------------
  build-worker-android:
    name: Worker App — Android (APK/AAB)
    needs: [verify-quality-gate]
    if: |
      always() &&
      (needs.verify-quality-gate.result == 'success') &&
      ((github.event_name == 'push') ||
      (inputs.app == 'all' || inputs.app == 'worker') &&
      (inputs.platform == 'all' || inputs.platform == 'android') &&
      (inputs.build_mode == 'local' || inputs.build_mode == null))
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Worker Android Package (Local Runner)
        run: |
          mkdir -p apps/worker/build-output
          PROFILE="${{ inputs.profile || 'preview' }}"
          echo "Building Opskl Worker with profile: $PROFILE"
          cd apps/worker
          npx eas-cli build --platform android --profile "$PROFILE" --local --output="./build-output/opskil-worker-$PROFILE.apk" --non-interactive
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder' }}
          EXPO_PUBLIC_APP_ENV: ${{ inputs.profile == 'production' && 'production' || 'preview' }}
          EXPO_PUBLIC_DEFAULT_CITY: 'Mumbai'

      - name: Upload Worker Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opskil-worker-android-${{ inputs.profile || 'preview' }}
          path: apps/worker/build-output/*.apk
          retention-days: 30

  # -------------------------------------------------------------
  # 2. Opskl Organizer (User) Android APK
  # -------------------------------------------------------------
  build-organizer-android:
    name: Organizer (User) App — Android (APK/AAB)
    needs: [verify-quality-gate]
    if: |
      always() &&
      (needs.verify-quality-gate.result == 'success') &&
      ((github.event_name == 'push') ||
      (inputs.app == 'all' || inputs.app == 'organizer') &&
      (inputs.platform == 'all' || inputs.platform == 'android') &&
      (inputs.build_mode == 'local' || inputs.build_mode == null))
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Organizer Android Package (Local Runner)
        run: |
          mkdir -p apps/organizer/build-output
          PROFILE="${{ inputs.profile || 'preview' }}"
          echo "Building Opskl Organizer with profile: $PROFILE"
          cd apps/organizer
          npx eas-cli build --platform android --profile "$PROFILE" --local --output="./build-output/opskil-organizer-$PROFILE.apk" --non-interactive
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder' }}
          EXPO_PUBLIC_APP_ENV: ${{ inputs.profile == 'production' && 'production' || 'preview' }}
          EXPO_PUBLIC_DEFAULT_CITY: 'Mumbai'

      - name: Upload Organizer Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opskil-organizer-android-${{ inputs.profile || 'preview' }}
          path: apps/organizer/build-output/*.apk
          retention-days: 30

  # -------------------------------------------------------------
  # 3. Opskl Worker iOS IPA / Simulator Build
  # -------------------------------------------------------------
  build-worker-ios:
    name: Worker App — iOS (IPA/Simulator)
    needs: [verify-quality-gate]
    if: |
      always() &&
      (needs.verify-quality-gate.result == 'success') &&
      ((github.event_name == 'push') ||
      (inputs.app == 'all' || inputs.app == 'worker') &&
      (inputs.platform == 'all' || inputs.platform == 'ios') &&
      (inputs.build_mode == 'local' || inputs.build_mode == null))
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Worker iOS Package (Local macOS Runner)
        run: |
          mkdir -p apps/worker/build-output
          PROFILE="${{ inputs.profile || 'preview-simulator' }}"
          echo "Building Opskl Worker iOS with profile: $PROFILE"
          cd apps/worker
          npx eas-cli build --platform ios --profile "$PROFILE" --local --output="./build-output/opskil-worker-$PROFILE.tar.gz" --non-interactive
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder' }}
          EXPO_PUBLIC_APP_ENV: ${{ inputs.profile == 'production' && 'production' || 'preview' }}
          EXPO_PUBLIC_DEFAULT_CITY: 'Mumbai'

      - name: Upload Worker iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opskil-worker-ios-${{ inputs.profile || 'preview' }}
          path: apps/worker/build-output/*
          retention-days: 30

  # -------------------------------------------------------------
  # 4. Opskl Organizer (User) iOS IPA / Simulator Build
  # -------------------------------------------------------------
  build-organizer-ios:
    name: Organizer (User) App — iOS (IPA/Simulator)
    needs: [verify-quality-gate]
    if: |
      always() &&
      (needs.verify-quality-gate.result == 'success') &&
      ((github.event_name == 'push') ||
      (inputs.app == 'all' || inputs.app == 'organizer') &&
      (inputs.platform == 'all' || inputs.platform == 'ios') &&
      (inputs.build_mode == 'local' || inputs.build_mode == null))
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Organizer iOS Package (Local macOS Runner)
        run: |
          mkdir -p apps/organizer/build-output
          PROFILE="${{ inputs.profile || 'preview-simulator' }}"
          echo "Building Opskl Organizer iOS with profile: $PROFILE"
          cd apps/organizer
          npx eas-cli build --platform ios --profile "$PROFILE" --local --output="./build-output/opskil-organizer-$PROFILE.tar.gz" --non-interactive
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder' }}
          EXPO_PUBLIC_APP_ENV: ${{ inputs.profile == 'production' && 'production' || 'preview' }}
          EXPO_PUBLIC_DEFAULT_CITY: 'Mumbai'

      - name: Upload Organizer iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opskil-organizer-ios-${{ inputs.profile || 'preview' }}
          path: apps/organizer/build-output/*
          retention-days: 30

  # -------------------------------------------------------------
  # 5. Opskl Admin Console — Next.js Production Web Bundle
  # -------------------------------------------------------------
  build-admin-web:
    name: Admin Console — Web Distribution Bundle
    needs: [verify-quality-gate]
    if: |
      always() &&
      (needs.verify-quality-gate.result == 'success') &&
      ((github.event_name == 'push') ||
      (inputs.app == 'all' || inputs.app == 'admin') &&
      (inputs.platform == 'all' || inputs.platform == 'web'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Next.js Production App
        run: npm run build:admin
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder' }}
          NEXT_PUBLIC_APP_ENV: 'production'
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://admin.opskil.com' }}

      - name: Archive Admin Production Artifacts
        run: |
          mkdir -p build-output
          tar -czvf build-output/opskil-admin-production.tar.gz -C apps/admin .next public package.json

      - name: Upload Admin Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opskil-admin-production-web
          path: build-output/opskil-admin-production.tar.gz
          retention-days: 30

  # -------------------------------------------------------------
  # 6. Publish Official GitHub Release & Attach Artifacts
  # -------------------------------------------------------------
  publish-release:
    name: Package & Publish GitHub Release 1.0.0
    needs:
      - build-worker-android
      - build-organizer-android
      - build-worker-ios
      - build-organizer-ios
      - build-admin-web
    if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Consolidate Release Assets
        run: |
          mkdir -p release-dist
          find release-artifacts -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.tar.gz" -o -name "*.ipa" \) -exec cp {} release-dist/ \;
          ls -la release-dist

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: Opskl ${{ github.ref_name || 'v1.0.0' }} — Production Release
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
